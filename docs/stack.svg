<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="Built with: Firebase AI Logic, Gemini Nano, Gemini 3.5 Flash, Gemini TTS, App Check, Chrome extension (Manifest V3), Firebase Hosting, TypeScript, esbuild, Vitest and Playwright">
