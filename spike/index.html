<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Osmosis spike</title></head>
<body>
<h1>Osmosis spike</h1>
<button id="dl">Prepare on-device model</button>
<pre id="log"></pre>
<script>
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; console.log(...a); };
window.spike = { progress: null, ready: false, error: null };

async function availability(langs) {
  if (!('LanguageModel' in self)) return 'no-api';
  try {
    return await LanguageModel.availability({
      expectedInputs: [{ type: 'text', languages: ['en'] }],
      expectedOutputs: [{ type: 'text', languages: langs }],
    });
  } catch (e) { return 'error: ' + e.message; }
}
window.availability = availability;

document.getElementById('dl').addEventListener('click', async () => {
  try {
    const s = await LanguageModel.create({
      expectedInputs: [{ type: 'text', languages: ['en'] }],
      expectedOutputs: [{ type: 'text', languages: ['es'] }],
      monitor(m) { m.addEventListener('downloadprogress', e => { window.spike.progress = e.loaded; log('download', (e.loaded * 100).toFixed(1) + '%'); }); },
    });
    s.destroy();
    window.spike.ready = true; log('model ready');
  } catch (e) { window.spike.error = e.name + ': ' + e.message; log('create error', window.spike.error); }
});

// One single-turn rewrite call (mirrors how Firebase AI Logic calls the on-device model).
window.rewrite = async ({ lang, level, sentences, schema }) => {
  const sys = `You help an English speaker learn ${lang}. Translate each given English sentence into natural ${lang} at CEFR ${level} level: short sentences, common words, present tense when possible. Keep names and numbers. Also pick 1-2 useful ${lang} words per sentence with their English meaning.`;
  const t0 = performance.now();
  const session = await LanguageModel.create({
    initialPrompts: [{ role: 'system', content: sys }],
    expectedInputs: [{ type: 'text', languages: ['en'] }],
    expectedOutputs: [{ type: 'text', languages: [lang === 'Spanish' ? 'es' : lang === 'Japanese' ? 'ja' : 'en'] }],
  });
  const tCreate = performance.now() - t0;
  const input = sentences.map((s, i) => `${i + 1}. ${s}`).join('\n');
  const t1 = performance.now();
  let first = null, out = '';
  const stream = session.promptStreaming(input, schema ? { responseConstraint: schema } : {});
  for await (const chunk of stream) { if (first === null) first = performance.now() - t1; out += chunk; }
  const total = performance.now() - t1;
  session.destroy();
  return { tCreate: Math.round(tCreate), ttft: Math.round(first), total: Math.round(total), chars: out.length, out };
};
</script>
</body>
</html>
